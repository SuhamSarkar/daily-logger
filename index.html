<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for proper text rendering -->
    <meta charset="UTF-8">

    <!-- Ensures proper responsiveness on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO description for the website -->
    <meta name="description" content="Daily Logger - A professional real-time collaborative logging platform.">

    <!-- Website title shown in browser tab -->
    <title>Daily Logger</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css?v=8">
</head>





<body>

    <!-- =========================
         HEADER / BANNER SECTION
         ========================= -->
    <header class="main-header">

        <!-- Container to control layout width -->
        <div class="header-container">

            <!-- Logo / Brand Name -->
            <div class="brand">
                <h1 class="brand-title">DAILY LOGGER</h1>
                <p class="brand-subtitle">Professional Real-Time Logging Platform</p>
            </div>

        </div>

    </header>








    <!-- Main Content Placeholder (We will build this later) -->
    <main class="main-content">
        
            <!-- Container where name cards will be added dynamically -->
            <div id="logContainer"></div>


            <!-- Delete Mode Action Bar (Hidden by default) -->
            <div id="deleteActionBar" style="display: none; margin-top: 20px; text-align: right;">
                <button id="confirmDeleteBtn">Delete Selected</button>
            </div>

    </main>

 







    <!-- =========================
         FLOATING ACTION BUTTON (FAB)
         ========================= -->

    <!-- Floating Button Container -->
    <div class="fab-container">

        <!-- Drop-up Menu -->
        <div class="fab-menu" id="fabMenu">

            <!-- File Option (No logic yet) -->
            <button class="fab-option">
                <span class="fab-icon">📄</span>
                <span class="fab-label">Enter Name</span>
            </button>

                    <!-- Delete Option (Logic will be added later) -->
            <button class="fab-option" id="deleteOption">
                <span class="fab-icon">🗑️</span>
                <span class="fab-label">Delete</span>
            </button>


        </div>





        <!-- Main Plus Button -->
        <button class="fab-main" id="fabToggle">
            +
        </button>
    </div>






<!-- =========================
     NAME MODAL
     ========================= -->
<div id="nameModal" class="name-modal">

    <div class="name-modal-content">

        <h2>Name Yourself</h2>

        <input 
            type="text" 
            id="nameInput" 
            placeholder="Enter your name"
        >

        <div class="name-modal-actions">
            <button id="saveNameBtn">Save</button>
            <button id="closeNameModal">Cancel</button>
        </div>
    </div>
</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
